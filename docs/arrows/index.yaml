# audited_sha values are meaningful again: dc77249 is the repository's root commit
# after the 2026-08-22 history reset, and every sha recorded below resolves. This
# was the first audit able to compute a real incremental window, and it used one --
# only interface, landing and operations had source changes and only those three
# were re-audited. The remaining eight keep dc77249, which is still accurate: none
# of their files has changed since it.
#
# CAVEAT: 6346ba8 is on the unmerged branch `landing-page`. If that branch is
# squash-merged the sha stops resolving and those three segments need re-stamping
# to the merge commit -- the same failure the reset above caused.

# Segments follow the signal path: sensor data becomes observations, observations
# become metrics, metrics become language, outcomes become progression. Curriculum
# supplies the graph all of that runs on; access and operations carry the system.
# Interface sits across the path rather than on it: every segment's surfaces are drawn
# in the visual language it owns, and it owns no behaviour of its own. Landing sits off it
# entirely: it renders no learner state and exists to hold one constraint -- what the
# product may claim in public.
